services:
  miaomiaowu:
    build: .
    image: mmwx:local
    restart: unless-stopped
    user: root
    environment:
      - PORT=8080
      - DATABASE_PATH=/app/data/traffic.db
      - LOG_LEVEL=info

    ports:
      - "${MMWX_PORT:-8080}:8080"

    volumes:
      - mmwx_data:/app/data
      - mmwx_subscribes:/app/subscribes
      - mmwx_rule_templates:/app/rule_templates

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  mmwx_data:
  mmwx_subscribes:
  mmwx_rule_templates:
